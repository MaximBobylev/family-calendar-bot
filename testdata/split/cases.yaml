# Деление сообщения на дела (US-62, ADR-0008, src/bot/multi-split.ts). Переносимые данные (ADR-0006), золотой корпус.
# expect — куски по порядку: point / recurrence — кусок даты для парсера, title — черновое название без LLM,
# action: other — изменение / удаление / показ (не создаём), undated — дело без даты («ещё …»), borrow — номер куска,
# у которого перечисление берёт название и время. Поле не указано — не проверяется; один кусок — сообщение не делится.
# foreign: true — пересланный текст (вёрстка, часы работы, время сообщений чата). «Сейчас» — пн 2026-10-12 10:00 МСК.
defaults:
  now: "2026-10-12T10:00"
  tz: Europe/Moscow

cases:
  # --- фразы замера (research/multi-event-eval.md), делить ---
  - text: "Запиши в пятницу в 10 стоматолог, а в субботу в 12 футбол у Вани"
    expect: [{ point: "в пятницу в 10", title: "Стоматолог" }, { point: "в субботу в 12", title: "Футбол у Вани" }]
  - text: "Не забудь, у Пети день рождения 12 ноября, а у Маши — 3 декабря"
    expect: [{ point: "12 ноября", title: "День рождения Пети" }, { point: "3 декабря", title: "День рождения Маши" }]
  - text: "В пятницу встреча с Петей в 10 и созвон с Машей в 15"
    expect: [{ point: "В пятницу в 10", title: "Встреча с Петей" }, { point: "в 15", title: "Созвон с Машей" }]
  - text: "Завтра в 9 планёрка и ещё созвон с Олегом"
    expect: [{ point: "Завтра в 9", title: "Планёрка" }, { undated: true, title: "Созвон с Олегом" }]
  - text: "Напоминаем: в среду в 17 хор, в четверг в 18 сольфеджио, в субботу в 11 концерт"
    expect: [{ point: "в среду в 17", title: "Хор" }, { point: "в четверг в 18", title: "Сольфеджио" }, { point: "в субботу в 11", title: "Концерт" }]
  - text: "Поставь обед с Аней в среду в 13 и удали планёрку в четверг"
    expect: [{ point: "в среду в 13", title: "Обед с Аней" }, { action: other }]
  - text: "В четверг в 16 стоматолог Вани, отводит папа, и в субботу в 10 плавание Маши, всё в семейный календарь"
    expect: [{ point: "В четверг в 16", title: "Стоматолог Вани" }, { point: "в субботу в 10", title: "Плавание Маши" }]
  - text: "Во вторник в 19 родительское собрание, в среду в 8 анализы, в четверг в 20 кино"
    expect: [{ point: "Во вторник в 19", title: "Родительское собрание" }, { point: "в среду в 8", title: "Анализы" }, { point: "в четверг в 20", title: "Кино" }]
  - text: "Dentist on Friday at 10 and football on Saturday at noon"
    expect: [{ point: "on Friday at 10", title: "Dentist" }, { point: "on Saturday at noon", title: "Football" }]
  - text: "В пятницу и в субботу в 10 футбол"
    expect: [{ point: "В пятницу в 10", title: "Футбол", borrow: 1 }, { point: "в субботу в 10", title: "Футбол" }]
  - text: "Пн 17:00 — танцы, Вт 18:00 — английский, Ср 16:00 — рисование"
    expect: [{ point: "Пн 17:00", title: "Танцы" }, { point: "Вт 18:00", title: "Английский" }, { point: "Ср 16:00", title: "Рисование" }]
  - text: "запиши завтра в восемь утра анализы потом в три часа забрать машу из садика и в пятницу в семь вечера ужин у родителей"
    expect:
      - { point: "завтра в восемь утра", title: "Анализы" }
      - { point: "в три часа", title: "Забрать машу из садика" }
      - { point: "в пятницу в семь вечера", title: "Ужин у родителей" }

  # --- фразы замера, не делить ---
  - { text: "Встреча с Петей и Машей в пятницу в 10", expect: [{ point: "в пятницу в 10", title: "Встреча с Петей и Машей" }] }
  - { text: "Созвон в среду или в четверг в 15", expect: [{}] }
  - { text: "Тренировка каждый вторник и четверг в 19", expect: [{ recurrence: "каждый вторник и четверг в 19", title: "Тренировка" }] }

  # --- контрольные из замера ---
  - { text: "Обед в среду с 13 до 14", expect: [{ point: "в среду с 13 до 14", title: "Обед" }] }
  - { text: "Футбол в субботу, в 10 утра", expect: [{ point: "в субботу в 10 утра", title: "Футбол в субботу" }] }
  - { text: "Ужин у Пети в пятницу в 19, ул. Ленина, 5", expect: [{ point: "в пятницу в 19", title: "Ужин у Пети" }] }
  - { text: "Созвон с Петей завтра в 15:30 на полчаса", expect: [{ point: "завтра в 15:30", title: "Созвон с Петей" }] }
  - { text: "Стоматолог Вани в четверг в 16, отводит папа", expect: [{ point: "в четверг в 16", title: "Стоматолог Вани" }] }
  - { text: "Отпуск с 10 по 20 ноября", expect: [{ point: "с 10 по 20 ноября", title: "Отпуск" }] }
  - { text: "Встреча с Васей и Петей завтра, а потом обед", expect: [{ point: "завтра" }] }
  - text: "В 10 встреча с Петей и в пятницу созвон в 15"
    expect: [{ point: "В 10", title: "Встреча с Петей" }, { point: "в пятницу в 15", title: "Созвон" }]
  - text: "Каждый понедельник в 10 планёрка и в среду в 15 ретро"
    expect: [{ recurrence: "Каждый понедельник в 10", title: "Планёрка" }, { point: "в среду в 15", title: "Ретро" }]

  # --- уточнение, а не второе дело ---
  - { text: "Созвон с Петей завтра в 15, а в субботу если получится", expect: [{}] }
  - { text: "Встреча завтра в 10, место: кафе Пушкин", expect: [{ point: "завтра в 10" }] }
  - { text: "Поставь встречу на завтра в 15. Тема: бюджет", expect: [{ point: "на завтра в 15" }] }
  - { text: "Дача в субботу и воскресенье", expect: [{}] }
  - { text: "Ромео и Джульетта в субботу в 19", expect: [{ point: "в субботу в 19", title: "Ромео и Джульетта" }] }
  - { text: "Поставь встречу в пятницу, в 10, в переговорке", expect: [{ point: "в пятницу в 10" }] }
  - { text: "Созвон завтра в 15, 30 минут", expect: [{ point: "завтра в 15 30" }] }
  - { text: "в пятницу, в 10 футбол", expect: [{ point: "в пятницу в 10" }] }

  # --- перечисление и общий день ---
  - text: "Кофе и пончики завтра в 9 и обед в 13"
    expect: [{ point: "завтра в 9", title: "Кофе и пончики" }, { point: "в 13", title: "Обед" }]
  - text: "Поставь встречу с Машей в пятницу в 11 и созвон с Петей в понедельник в 10"
    expect: [{ point: "в пятницу в 11" }, { point: "в понедельник в 10", title: "Созвон с Петей" }]
  - text: "Dinner at 7 and a movie at 9"
    expect: [{ point: "at 7", title: "Dinner" }, { point: "at 9", title: "A movie" }]
  - text: "Напомни мне завтра в 9 позвонить маме и в 12 забрать посылку"
    expect: [{ point: "завтра в 9", title: "Позвонить маме" }, { point: "в 12", title: "Забрать посылку" }]

  # --- эллипсис названий ---
  - text: "В среду в 15 созвон с Петей, а в четверг в 16 с Машей"
    expect: [{ point: "В среду в 15", title: "Созвон с Петей" }, { point: "в четверг в 16", title: "Созвон с Машей" }]
  - text: "У Пети ДР 5 ноября, а у Маши 7 ноября"
    expect: [{ point: "5 ноября", title: "День рождения Пети" }, { point: "7 ноября", title: "День рождения Маши" }]

  # --- глаголы: изменение, удаление, показ ---
  - { text: "Покажи завтра и удали планёрку", expect: [{ action: other }, { action: other }] }
  - { text: "Перенеси обед на 14 и созвон на 15", expect: [{ action: other }, { action: other }] }
  - { text: "Удали обед и поставь созвон с Петей на 13", expect: [{ action: other }, { title: "Созвон с Петей" }] }
  - { text: "Что у меня завтра и поставь созвон на 15", expect: [{ action: other }] }
  - { text: "второе — в 13", expect: [{ point: "в 13" }] }

  # --- поручение внутри: сюда не доходит (routeIntent), но делитель не ломает фразу ---
  - { text: "Напомни мужу забрать Машу из садика завтра в 17", expect: [{ point: "завтра в 17" }] }

  # --- пересланное ---
  - foreign: true
    text: "Расписание на неделю:\nПн 17:00 — танцы\nВт 18:00 — английский\nСр 16:00 — рисование\nЧт 17:30 — бассейн"
    expect:
      - { point: "Пн 17:00", title: "Танцы" }
      - { point: "Вт 18:00", title: "Английский" }
      - { point: "Ср 16:00", title: "Рисование" }
      - { point: "Чт 17:30", title: "Бассейн" }
  - foreign: true
    text: "Уважаемые родители! Собрание в пятницу.\nНачало в 18:30."
    expect: [{}]
  - foreign: true
    text: "Маша\nПривет! Как насчёт встретиться на выходных?\nДавай! Когда тебе удобно?\nВ субботу в 12:30 в кафе «Пушкин», Тверской бульвар, 26\n14:02\nОтлично, до встречи!"
    expect: [{}]
  - foreign: true
    text: "Ок, до встречи в пятницу\n9:41 PM\nВ 19:30 у входа\n9:42 PM ✓✓"
    expect: [{}]
  - foreign: true
    text: "Jazz Night\nSaturday, Oct 24\nDoors 7:30 pm\nBlue Note Club, 131 W 3rd St\nFree entry · Live quartet"
    expect: [{}]
  - foreign: true
    text: "Концерт\nПЯТНИЦА\n16\nоктября\nКонцертный зал им. Чайковского, пл. Маяковского, 20\n(К юбилею со дня рождения)\nНачало в 18 часов 30 минут"
    expect: [{}]
  - foreign: true
    text: "Студия «Радуга». Часы работы: Пн–Пт 10:00–20:00. Мастер-класс по лепке в субботу в 12:00"
    expect: [{ point: "в субботу в 12:00" }]
  - foreign: true
    text: "Напоминаем: в среду в 17 хор, в четверг в 18 сольфеджио, в субботу в 11 концерт, удалите старое расписание"
    expect: [{ title: "Хор" }, { title: "Сольфеджио" }, { title: "Концерт" }, { action: other }]
