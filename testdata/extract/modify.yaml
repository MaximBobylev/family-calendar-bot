# Фразы изменения события: что указывает на событие (reference), куда переносим (target),
# сдвиг (shift), длительность (duration). «Сейчас» — среда 2026-10-07 10:00 МСК.
defaults:
  now: "2026-10-07T10:00"
  tz: Europe/Moscow

cases:
  - { text: "Перенеси встречу с Петей на завтра", expect: { target: "на завтра" } }
  - { text: "Сдвинь созвон в 15 на час позже", expect: { reference: "в 15", shift: "на час позже" } }
  - { text: "Перенеси планёрку на 11", expect: { target: "на 11" } }
  - { text: "Перенеси следующую встречу на пятницу", expect: { target: "на пятницу" } }
  - { text: "Перенеси встречу в среду на пятницу в 15", expect: { reference: "в среду", target: "на пятницу в 15" } }
  - { text: "Перенеси завтрашнюю встречу на четверг", expect: { reference: "завтра", target: "на четверг" } }
  - { text: "Перенеси обед на полчаса раньше", expect: { shift: "на полчаса раньше" } }
  - { text: "Перенеси созвон на час", expect: { shift: "на час" } }
  - { text: "Сделай встречу в среду на полтора часа", expect: { reference: "в среду", duration: "на полтора часа" } }
  - { text: "Переименуй завтрашнюю встречу в Ревью дизайна", expect: { reference: "завтра" } }
  - { text: "Move the call to Friday", expect: { target: "to Friday" } }
  - { text: "Сдвинь завтрашнюю встречу в 15 на полчаса позже", expect: { reference: "завтра в 15", shift: "на полчаса позже" } }
  # Реальная фраза (2026-10-05): раньше разбиралась целиком как «вторник 11:00»
  - { text: "Перенеси встречу во вторник на 11 утра.", expect: { reference: "во вторник", target: "на 11 утра" } }
  - { text: "Перенеси созвон в среду на четверг на 15", expect: { reference: "в среду", target: "на четверг на 15" } }
