# Извлечение фрагментов дат из всего сообщения (src/dates/extract.ts). Переносимые данные (ADR-0006).
# «Сейчас» — среда 2026-10-07 10:00 МСК.
defaults:
  now: "2026-10-07T10:00"
  tz: Europe/Moscow

