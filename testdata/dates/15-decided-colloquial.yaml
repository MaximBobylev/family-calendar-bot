  # 15. При создании: «на этой неделе» = «на неделе» (один день); «в выходные» — варианты сб / вс. Чтение — период

  - id: d15-001
    text: "на этой неделе"
    note: "среда: остаток чт–пт → четверг, как d07-002"
    expect: { date: "2026-10-08" }

  - id: d15-002
    text: "на этой неделе"
