# Разговорные формы и фразы, не участвовавшие в первой версии парсера (проверка на переобучение).
# «Сейчас» — среда 2026-10-07 10:00.
defaults:
  now: "2026-10-07T10:00"
  tz: Europe/Moscow
  kind: point

cases:
  - id: col-001
    text: "в четверг в 18:30"
    expect: { datetime: "2026-10-08T18:30" }

  - id: col-002
    text: "послезавтра утром"
    expect: { date: { date: "2026-10-09", part: morning } }

  - id: col-003
    text: "в 4 дня"
    expect: { datetime: "2026-10-07T16:00" }

  - id: col-004
    text: "в 11 вечера"
    expect: { datetime: "2026-10-07T23:00" }

  - id: col-005
    text: "в 2 ночи"
    expect: { datetime: "2026-10-08T02:00" }

  - id: col-006
    text: "двадцать восьмого октября"
    expect: { date: "2026-10-28" }

  - id: col-007
    text: "31.12"
    expect: { date: "2026-12-31" }

  - id: col-008
    text: "без десяти семь"
    note: "правило AM/PM применяется к получившемуся часу (6:50 → 1…6 → вечер), как «в 6» → 18:00"
    expect: { datetime: "2026-10-07T18:50" }

  - id: col-009
    text: "в понедельник утром в 9"
    expect: { datetime: "2026-10-12T09:00" }

  - id: col-010
    text: "в 12 дня"
    expect: { datetime: "2026-10-07T12:00" }

  - id: col-011
    text: "через полчаса"
    expect: { datetime: "2026-10-07T10:30" }

  - id: col-012
    text: "в 0:30"
    note: "00:30 сегодня прошло → завтра"
    expect: { datetime: "2026-10-08T00:30" }

  - id: col-013
    text: "часов в 5"
    note: "приблизительное время = точное"
    expect: { datetime: "2026-10-07T17:00" }

  - id: col-014
    text: "где-то в 3"
    expect: { datetime: "2026-10-07T15:00" }

  - id: col-015
    text: "около трех"
    expect: { datetime: "2026-10-07T15:00" }

  - id: col-016
    text: "примерно в 11"
    expect: { datetime: "2026-10-07T11:00" }

  - id: col-017
    text: "в обед"
    note: "обед = 13:00"
    expect: { datetime: "2026-10-07T13:00" }

  - id: col-018
    text: "завтра в обед"
    expect: { datetime: "2026-10-08T13:00" }

  - id: col-019
    text: "at half past three"
    expect: { datetime: "2026-10-07T15:30" }

  - id: col-020
    text: "friday 5pm"
    expect: { datetime: "2026-10-09T17:00" }

  - id: col-021
    text: "tonight at 8"
    expect: { datetime: "2026-10-07T20:00" }

  - id: col-022
    text: "monday at 10am"
    expect: { datetime: "2026-10-12T10:00" }

  # Должны остаться неразобранными — уточняем у пользователя
  - id: col-030
    text: "в начале недели"
    expect: { error: unparseable }

  - id: col-031
    text: "на днях"
    expect: { error: unparseable }

  - id: col-032
    text: "после работы"
    expect: { error: unparseable }

  - id: col-033
    text: "к 18"
    note: "срок («к», «до») — не момент события; для поручений нужен отдельный kind (R1)"
    expect: { error: unparseable }

  - id: col-034
    text: "до пятницы"
    expect: { error: unparseable }

  # Диапазоны, сдвиги, повторения
  - id: col-040
    kind: range
    text: "на этих выходных"
    expect: { range: { from: "2026-10-10", to: "2026-10-11" } }

  - id: col-041
    kind: range
    text: "в декабре"
    expect: { range: { from: "2026-12-01", to: "2026-12-31" } }

  - id: col-042
    kind: shift
    text: "на 20 минут позже"
    expect: { shift: "+PT20M" }

  - id: col-043
    kind: recurrence
    text: "каждые две недели"
    expect: { recurrence: { freq: weekly, interval: 2 } }

  - id: col-044
    kind: recurrence
    text: "по понедельникам и средам в 8 утра"
    expect: { recurrence: { freq: weekly, by_day: [MO, WE], time: "08:00" } }

  - id: col-045
    kind: recurrence
    text: "каждый четверг в 19:30"
    expect: { recurrence: { freq: weekly, by_day: [TH], time: "19:30" } }

  # «на» перед числом — время (перенос: «перенеси на 11»)
  - id: col-050
    text: "на 11"
    expect: { datetime: "2026-10-07T11:00" }

  - id: col-051
    text: "на 3"
    expect: { datetime: "2026-10-07T15:00" }

  - id: col-052
    text: "на завтра на 15"
    expect: { datetime: "2026-10-08T15:00" }

  - id: col-053
    text: "на 10 минут"
    note: "это длительность, а не момент — разбирается kind=duration"
    expect: { error: unparseable }
