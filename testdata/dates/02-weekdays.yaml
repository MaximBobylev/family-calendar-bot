# Дни недели. «Сейчас» — среда 2026-10-07 10:00, если не указано иное.
# Календарь: пн 05, ср 07, чт 08, пт 09, сб 10, вс 11, пн 12, вт 13, ср 14, пт 16.
defaults:
  now: "2026-10-07T10:00"
  tz: Europe/Moscow
  kind: point

cases:
  - id: wd-001
    text: "в пятницу"
    expect: { date: "2026-10-09" }

  - id: wd-002
    text: "в пятницу в 15"
    expect: { datetime: "2026-10-09T15:00" }

  - id: wd-003
    text: "в пятницу в 3"
    expect: { datetime: "2026-10-09T15:00" }

  - id: wd-004
    text: "в понедельник"
    expect: { date: "2026-10-12" }

  - id: wd-005
    text: "во вторник"
    expect: { date: "2026-10-13" }

  - id: wd-006
    text: "в чт"
    note: "сокращение"
    expect: { date: "2026-10-08" }

  - id: wd-007
    text: "в пт в 19:00"
    expect: { datetime: "2026-10-09T19:00" }

  - id: wd-008
    text: "в среду в 12"
    note: "date-rules: сегодня среда, 12:00 ещё не прошло"
    expect:
      ambiguous:
        - { datetime: "2026-10-07T12:00" }
        - { datetime: "2026-10-14T12:00" }

  - id: wd-009
    text: "в среду в 9"
    note: "date-rules: сегодня среда, 09:00 уже прошло → следующая среда"
    expect: { datetime: "2026-10-14T09:00" }

  - id: wd-010
    text: "в среду"
    note: "день совпадает с сегодня, времени нет → тоже два варианта"
    expect:
      ambiguous:
        - { date: "2026-10-07" }
        - { date: "2026-10-14" }

  - id: wd-011
    text: "в эту пятницу"
    expect: { date: "2026-10-09" }

  - id: wd-012
    text: "в эту среду"
    note: "«эта» + сегодняшний день → сегодня"
    expect: { date: "2026-10-07" }

  - id: wd-013
    text: "в следующую пятницу"
    note: "date-rules: две кнопки"
    expect:
      ambiguous:
        - { date: "2026-10-09" }
        - { date: "2026-10-16" }

  - id: wd-014
    text: "в пятницу на следующей неделе"
    expect: { date: "2026-10-16" }

  - id: wd-015
    text: "в следующий понедельник"
    note: "единое правило для «следующий <день>»: ближайший и через неделю после него (как wd-013, wd-020)"
    expect:
      ambiguous:
        - { date: "2026-10-12" }
        - { date: "2026-10-19" }

  - id: wd-016
    text: "в субботу утром"
    expect: { date: { date: "2026-10-10", part: morning } }

  - id: wd-017
    text: "в пятницу вечером в 7"
    expect: { datetime: "2026-10-09T19:00" }

  - id: wd-018
    text: "в понедельник"
    now: "2026-10-04T12:00"
    note: "сейчас воскресенье"
    expect: { date: "2026-10-05" }

  - id: wd-019
    text: "в эту пятницу"
    now: "2026-10-04T12:00"
    note: "в воскресенье «эта пятница» = ближайшая будущая, а не прошедшая"
    expect: { date: "2026-10-09" }

  - id: wd-020
    text: "в следующую среду"
    now: "2026-10-04T12:00"
    expect:
      ambiguous:
        - { date: "2026-10-07" }
        - { date: "2026-10-14" }

  - id: wd-021
    text: "в среду 14-го"
    note: "день недели и число согласованы"
    expect: { date: "2026-10-14" }

  - id: wd-022
    text: "в четверг 14-го"
    note: "14-е — среда; противоречие → оба варианта: по числу и по дню недели"
    expect:
      ambiguous:
        - { date: "2026-10-14" }
        - { date: "2026-10-15" }
