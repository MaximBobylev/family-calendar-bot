# Корпус с разными «сейчас» (ревью парсера дат 2026-10-08, шаг 3; tech-debt #26): ~60 типичных фраз, каждая — при шести
# «сейчас». Остальной корпус почти весь при одном «сейчас» (ср 10:00) и не ловит ошибки около полуночи, конца месяца/года и
# перехода времени. Ожидания — по docs/date-rules.md; найденные и исправленные расхождения помечены «ИСПРАВЛЕНО», решения
# там, где правила молчали, — в date-rules.md («Разные „сейчас“»). id: nvNN-<сейчас>, NN — номер фразы.
#   mon   — пн 2026-10-12 07:00 МСК          fri   — пт 2026-10-16 23:30 МСК     sun — вс 2026-10-18 23:50 МСК
#   dec31 — чт 2026-12-31 18:00 МСК          feb28 — вс 2027-02-28 12:00 МСК (невисокосный год)
#   dst   — вс 2026-10-25 01:30 Europe/Berlin (в 03:00 CEST часы переводят на 02:00 CET)
defaults:
  tz: Europe/Moscow
  kind: point

cases:
  # 01. «сегодня в 15»
  - { id: nv01-mon, text: "сегодня в 15", now: "2026-10-12T07:00", expect: {"datetime":"2026-10-12T15:00"} }
  - { id: nv01-fri, text: "сегодня в 15", now: "2026-10-16T23:30", expect: {"error":"in_past"} }
  - { id: nv01-sun, text: "сегодня в 15", now: "2026-10-18T23:50", expect: {"error":"in_past"} }
  - { id: nv01-dec31, text: "сегодня в 15", now: "2026-12-31T18:00", expect: {"error":"in_past"} }
  - { id: nv01-feb28, text: "сегодня в 15", now: "2027-02-28T12:00", expect: {"datetime":"2027-02-28T15:00"} }
  - { id: nv01-dst, text: "сегодня в 15", now: "2026-10-25T01:30", tz: Europe/Berlin, expect: {"datetime":"2026-10-25T15:00"} }

