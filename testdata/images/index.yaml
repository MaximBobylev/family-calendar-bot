# замер — scripts/eval-images.ts, итоги — docs/research/free-models-eval.md. Переносимые данные (ADR-0006).
#   text   — видимый текст (эталон для «идеального OCR»: прогон --models oracle проверяет сам набор и наш парсер)
#   event  — есть ли событие; false — ожидается no_event (или хотя бы без даты)
#   start  — ожидаемое начало после НАШЕГО парсера по видимому тексту (как в проде: foreignDateSpans); список — любое из
#   title  — слова, которые должны быть в названии; «a|b» — любое из (без регистра, с допуском на окончания)
#   place  — подстрока места (справочно)
