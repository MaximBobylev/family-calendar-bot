# R1-набор для scripts/eval-intents.ts (--set testdata/nlu/intents-r1.yaml): семейный диспетчер — поручения (US-91),
# ответственный и «для кого» (US-92), поиск (US-21), напоминания у событий (US-41/42), «мои дела», вставленный текст
# (как пересланное, US-65), несколько команд, болтовня, опечатки и голосовые формы. Переносимые данные (ADR-0006).
# Формат — как testdata/nlu/intents.yaml, плюс поля итога, как в карточке бота:
#   assignee    — исполнитель поручения после сопоставления с участниками дома (имя); null — «кто-то»;
#                 "?" — названный не нашёлся среди участников; "self" — себе (автор — владелец)
#   task        — название поручения (taskTitle); due — срок «YYYY-MM-DDTHH:MM» или «YYYY-MM-DD», null — без срока
#   start       — начало события (create), так же; responsible / for_whom — US-92 (участник / ребёнок), null — нет
#   query       — что ищет find_event (lookupQuery), next — «следующий/ближайший»
#   reminders   — минуты напоминаний у изменяемого события (detailHints), [] — убрать все
# Список = допустимые варианты. «Сейчас» — среда 2026-10-07 10:00 МСК. Имена — вымышленные.
defaults:
  now: "2026-10-07T10:00"
  tz: Europe/Moscow
  calendars:
    - { title: "Иван", aliases: [] }
    - { title: "Семья", aliases: ["общий"] }
    - { title: "Работа", aliases: [] }
