# Разбор интента LLM (src/nlu/intents.ts) — оценочный набор для scripts/eval-intents.ts. Переносимые данные (ADR-0006).
# Проверяем то, что бот реально использует ПОСЛЕ детерминированной обработки (src/bot/handle-update.ts):
#   intent   — после переопределения глаголами (DELETE_VERBS / MODIFY_VERBS); список = допустимы варианты;
#   title    — итоговое название после cleanTitle (фрагменты дат — из extract.ts); null = без названия
#              (бот спросит); список = допустимые варианты; сравнение без регистра, ё=е, без знаков;
#   calendar — итоговый календарь после сопоставления (create: findCalendarByName с падежами;
#              list: точное имя или алиас); null = не указан (календарь по умолчанию);
#              "?" = названный календарь не найден (бот ответит «нет такого календаря» — тоже приемлемо);
#   all_day  — LLM all_day ИЛИ looksAllDay(text) ИЛИ диапазон дат без времени (create-logic.ts делает его
#              событием на весь день сам).
# Поле не указано — не проверяется. «Сейчас» — среда 2026-10-07 10:00 МСК.
# Источник: реальные фразы из acceptance/scenarios (llm-фикстуры), контрастные примеры критики промпта,
# голосовые формы (Whisper: «Созван спеть и»), опечатки, английский и смешанный.
