# 5. Английский интерфейс: владелец с language_code=en.
- id: explore-english
  story: EXPLORE
  steps:
    - clock: "2026-10-07T07:00:00Z"
    - google_account:
        email: john@gmail.com
        calendars:
          - { id: john@gmail.com, summary: "John", accessRole: owner, primary: true, timeZone: Europe/Berlin }
          - { id: fam@group.calendar.google.com, summary: "Family", accessRole: writer, timeZone: Europe/Berlin }
    - llm:
        "Remind my wife to pick up Masha at 5pm": { tool: assign_task, args: { assignee: "wife", when: "at 5pm", task: "pick up Masha" } }
        "/help": { tool: unsupported }
        "Create household \"Smiths\"": { tool: unsupported }
    - telegram: { from: 1002, first_name: "John", language: en, text: "/start" }
    - oauth: { consent: john@gmail.com }
    # Язык по умолчанию — русский при любом language_code; английский — только в /settings
    - telegram: { from: 1002, language: en, text: "/settings" }
    - press: "🗣 English"
    - telegram: { from: 1002, language: en, text: "/start" }
    - telegram: { from: 1002, language: en, text: "/help" }
    - telegram: { from: 1002, language: en, text: "/home" }
    - telegram: { from: 1002, language: en, text: "Create household \"Smiths\"" }
    - telegram: { from: 1002, language: en, text: "/home create Smiths" }
    - press: "Done"
    - telegram: { from: 1002, language: en, text: "/home invite Kate, wife" }
    - capture_telegram: { kate: "start=home_([A-Za-z0-9_-]+)" }
    - telegram: { from: 2002, first_name: "Kate", language: en, text: "/start home_{{kate}}" }
    - telegram: { from: 1002, language: en, text: "Remind my wife to pick up Masha at 5pm" }
    - press: { button: "Assign", from: 1002 }
    - press: { button: "Can't", chat: 2002, from: 2002 }
    - telegram: { from: 1002, language: en, text: "/settings" }

