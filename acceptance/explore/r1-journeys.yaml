# Исследовательские сценарии продуктового ревью R1 (docs/research/product-review-r1.md). НЕ часть приёмки:
# раннер читает только acceptance/scenarios/. Ожиданий почти нет — сценарий проходит путь семьи, а ответы бота
# смотрим дампом фейкового Telegram (GET /__fake/telegram/calls). Запуск по одному id:
#   cp acceptance/explore/r1-journeys.yaml acceptance/scenarios/99-explore.yaml
#   docker compose run --rm -T -e SCENARIO=explore-onboarding acceptance
#   docker compose exec -T fakes node -e "fetch('http://localhost:9100/__fake/telegram/calls').then(r=>r.json()).then(c=>console.log(JSON.stringify(c,null,1)))"
#   rm acceptance/scenarios/99-explore.yaml
# «Сейчас» — ср 7 октября 2026, 10:00 МСК. Иван 1001 (allowlist, Google), Аня 2001 (жена, НЕ в allowlist, без Google).

# 1. Владелец: первый /start → Google → что дальше? → дом → приглашение. Жена: первый опыт без Google.
- id: explore-onboarding
  story: EXPLORE
  steps:
    - clock: "2026-10-07T07:00:00Z"
    - google_account:
        email: ivan@gmail.com
        calendars:
          - { id: ivan@gmail.com, summary: "Иван", accessRole: owner, primary: true, timeZone: Europe/Moscow }
          - id: family@group.calendar.google.com
            summary: "Семья"
            accessRole: writer
            timeZone: Europe/Moscow
            events:
              - { id: f1, summary: "Ужин у бабушки", start: { dateTime: "2026-10-08T19:00:00+03:00" }, end: { dateTime: "2026-10-08T21:00:00+03:00" } }
          - { id: holidays@group.v.calendar.google.com, summary: "Праздники", accessRole: reader }
    - llm:
        "/help": { tool: unsupported }
        "что ты умеешь?": { tool: unsupported }
        "Привет": { tool: unsupported }
        "Аня": { tool: unsupported }
        "Что у нас завтра?": { tool: list_events, args: { range: "завтра" } }
        "мои дела": { tool: unsupported }
        "напоминай мне за 15 минут до встреч": { tool: unsupported }
    - telegram: { from: 1001, first_name: "Иван", text: "/start" }
    - oauth: { consent: ivan@gmail.com }
    - telegram: { from: 1001, first_name: "Иван", text: "/start" }
    - telegram: { from: 1001, first_name: "Иван", text: "/help" }
    - telegram: { from: 1001, first_name: "Иван", text: "что ты умеешь?" }
    - telegram: { from: 1001, first_name: "Иван", text: "/home" }
    - telegram: { from: 1001, first_name: "Иван", text: "Создай дом \"Бобылевы\"" }
    - press: "Готово"
    - telegram: { from: 1001, first_name: "Иван", text: "/home" }
    - press: "➕ Пригласить"
    - capture_telegram: { invite: "start=home_([A-Za-z0-9_-]+)" }
    # Жена до приглашения пишет боту (её добавили в семейный чат, она нажала на бота)
    - telegram: { from: 2001, first_name: "Аня", text: "/start" }
    # По ссылке
    - telegram: { from: 2001, first_name: "Аня", text: "/start home_{{invite}}" }
    # Пишет имя не ответом (reply), а просто сообщением
    - telegram: { from: 2001, first_name: "Аня", text: "Аня" }
    - telegram: { from: 2001, first_name: "Аня", text: "/start" }
    - telegram: { from: 2001, first_name: "Аня", text: "/help" }
    - telegram: { from: 2001, first_name: "Аня", text: "Что у нас завтра?" }
    - telegram: { from: 2001, first_name: "Аня", text: "/settings" }
    - telegram: { from: 2001, first_name: "Аня", text: "/home" }
    - telegram: { from: 2001, first_name: "Аня", text: "мои дела" }
    - telegram: { from: 2001, first_name: "Аня", text: "напоминай мне за 15 минут до встреч" }
    - telegram: { from: 1001, first_name: "Иван", text: "/home" }
    - telegram: { from: 1001, first_name: "Иван", text: "/settings" }

# 2. Группа, поручения, эскалация, напоминания, «Не могу», дайджест жены без Google, изменения в Google.
- id: explore-family-day
  story: EXPLORE
  steps:
    - clock: "2026-10-07T07:00:00Z"
    - connected_user:
        from: 1001
        email: ivan@gmail.com
        calendars:
          - { id: ivan@gmail.com, summary: "Иван", accessRole: owner, primary: true, timeZone: Europe/Moscow }
          - id: family@group.calendar.google.com
            summary: "Семья"
            accessRole: writer
            timeZone: Europe/Moscow
            events:
              - { id: swim, summary: "Плавание Вани", start: { dateTime: "2026-10-10T10:00:00+03:00" }, end: { dateTime: "2026-10-10T11:00:00+03:00" } }
              - { id: din, summary: "Ужин у бабушки", start: { dateTime: "2026-10-08T19:00:00+03:00" }, end: { dateTime: "2026-10-08T21:00:00+03:00" } }
    - llm:
        "привет": { tool: unsupported }
        "Напомни жене забрать Машу из школы в 17": { tool: assign_task, args: { assignee: "жене", when: "в 17", task: "забрать Машу из школы" } }
        "Напомни мужу купить хлеб": { tool: assign_task, args: { assignee: "мужу", task: "купить хлеб" } }
        "кто-то должен купить корм коту завтра": { tool: assign_task, args: { when: "завтра", task: "купить корм коту" } }
        "что у нас на выходных?": { tool: list_events, args: { range: "на выходных" } }
        "Беру": { tool: unsupported }
        "мои дела": { tool: unsupported }
    - telegram: { from: 1001, first_name: "Иван", text: "/home create Бобылевы" }
    - press: { button: "✅ Иван", from: 1001 }
    - telegram: { from: 1001, first_name: "Иван", text: "/home invite Аня, жена, мама" }
    - capture_telegram: { anya: "start=home_([A-Za-z0-9_-]+)" }
    - telegram: { from: 2001, first_name: "Аня", text: "/start home_{{anya}}" }
    - telegram: { from: 1001, first_name: "Иван", text: "/home kid Маша" }
    - telegram: { from: 1001, first_name: "Иван", text: "/home kid Ваня" }
    # Бот добавлен в семейный чат; первое обращение до привязки, потом привязка
    - telegram: { from: 1001, first_name: "Иван", chat_id: -500, chat_type: group, text: "@cab_test_bot привет" }
    - telegram: { from: 1001, first_name: "Иван", chat_id: -500, chat_type: group, text: "/home link" }
    - telegram: { from: 2001, first_name: "Аня", chat_id: -500, chat_type: group, text: "@cab_test_bot что у нас на выходных?" }
    - telegram: { from: 2001, first_name: "Аня", chat_id: -500, chat_type: group, text: "/help@cab_test_bot" }
    # Поручение жене; она не отвечает
    - telegram: { from: 1001, first_name: "Иван", text: "Напомни жене забрать Машу из школы в 17" }
    - press: { button: "Поручить", from: 1001 }
    # Жена пишет «Беру» текстом вместо кнопки
    - telegram: { from: 2001, first_name: "Аня", text: "Беру" }
    - clock: "2026-10-07T12:00:00Z"
    - tick: true
    - clock: "2026-10-07T13:00:00Z"
    - tick: true
    - clock: "2026-10-07T21:00:00Z"
    - tick: true
    # Жена поручает мужу — у Ивана «других имён» нет (его никто не спрашивал); он задаёт их, жена повторяет; он «Не может»
    - telegram: { from: 2001, first_name: "Аня", text: "Напомни мужу купить хлеб" }
    - telegram: { from: 1001, first_name: "Иван", text: "/home name Иван, муж, папа" }
    - telegram: { from: 2001, first_name: "Аня", text: "Напомни мужу купить хлеб" }
    - press: { button: "Поручить", chat: 2001, from: 2001 }
    - press: { button: "Не могу", chat: 1001, from: 1001 }
    # «Кто-то должен» из семейного чата
    - telegram: { from: 2001, first_name: "Аня", chat_id: -500, chat_type: group, text: "@cab_test_bot кто-то должен купить корм коту завтра" }
    - press: { button: "Поручить", chat: -500, from: 2001 }
    # Изменение «мимо бота»: Иван в Google переносит ужин — кто узнает? (жена без Google, группа)
    - hourly: true
    - tick: true
    - google_external:
        calendar: family@group.calendar.google.com
        move: { id: din, start: { dateTime: "2026-10-08T20:00:00+03:00" }, end: { dateTime: "2026-10-08T22:00:00+03:00" } }
    - google_push: { calendar: family@group.calendar.google.com }
    - tick: true
    # Утро четверга: сводки
    - hourly: true
    - clock: "2026-10-08T05:00:00Z"
    - tick: true
    - telegram: { from: 2001, first_name: "Аня", text: "мои дела" }

# 3. Пересланное объявление школы и фото афиши — от жены без Google и от Ивана.
- id: explore-ingest
  story: EXPLORE
  steps:
    - clock: "2026-10-07T07:00:00Z"
    - connected_user:
        from: 1001
        email: ivan@gmail.com
        calendars:
          - { id: ivan@gmail.com, summary: "Иван", accessRole: owner, primary: true, timeZone: Europe/Moscow }
          - { id: family@group.calendar.google.com, summary: "Семья", accessRole: writer, timeZone: Europe/Moscow }
    - telegram: { from: 1001, first_name: "Иван", text: "/home create Бобылевы" }
    - telegram: { from: 1001, first_name: "Иван", text: "/home invite Аня, жена" }
    - capture_telegram: { anya: "start=home_([A-Za-z0-9_-]+)" }
    - telegram: { from: 2001, first_name: "Аня", text: "/start home_{{anya}}" }
    - llm:
        "Уважаемые родители! В пятницу 9 октября в 18:30 родительское собрание 3«Б» класса, каб. 21. Просьба не опаздывать.":
          { tool: create_event, args: { start: "в пятницу 9 октября в 18:30", title: "Родительское собрание 3Б" } }
    - telegram:
        from: 2001
        first_name: "Аня"
        text: "Уважаемые родители! В пятницу 9 октября в 18:30 родительское собрание 3«Б» класса, каб. 21. Просьба не опаздывать."
        forwarded: true
        forward_from: "Классный руководитель"
        forward_date: "2026-10-06T15:00:00Z"
    - press: { button: "📅 Создать событие из этого", from: 2001 }
    - press: { button: "Создать", from: 2001 }
    # Фото афиши от жены
    - photo:
        from: 2001
        content: "poster-theatre"
        seen: { text: "Кукольный театр «Буратино». 17 октября, 12:00. ДК Ленина", tool: create_event, args: { title: "Кукольный театр «Буратино»", start: "17 октября 12:00", location: "ДК Ленина" } }
    - press: { button: "Создать", from: 2001 }
    # Иван пересылает то же объявление — дубликат?
    - telegram:
        from: 1001
        first_name: "Иван"
        text: "Уважаемые родители! В пятницу 9 октября в 18:30 родительское собрание 3«Б» класса, каб. 21. Просьба не опаздывать."
        forwarded: true
        forward_from: "Классный руководитель"
        forward_date: "2026-10-06T15:00:00Z"
    - press: { button: "📅 Создать событие из этого", from: 1001 }
    # Фото без события
    - photo: { from: 1001, content: "img-cat", seen: { no_event: true, text: "" } }
    # Фото в семейном чате
    - telegram: { from: 1001, first_name: "Иван", chat_id: -500, chat_type: group, text: "/home link" }

