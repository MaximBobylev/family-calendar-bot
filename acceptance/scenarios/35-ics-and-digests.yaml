# US-67: файл приглашения .ics → «Добавить в календарь?» (разбор без LLM: UTC, TZID, весь день, повторение).
# US-70 (R1): сводки «Завтра» (21:00) и «Неделя» (вс 20:00 или пн 08:00) — по умолчанию выключены.
# «Сейчас» — ср 7 октября 2026, 10:00 МСК.

- id: ics-single-utc-event
  story: US-67
  steps:
    - &setup
      - clock: "2026-10-07T07:00:00Z"
      - connected_user:
          from: 1001
          email: ivan@gmail.com
          calendars:
            - id: ivan@gmail.com
              summary: "Иван"
              accessRole: owner
              primary: true
              timeZone: Europe/Moscow
              events:
                - { id: e1, summary: "Планёрка", start: { dateTime: "2026-10-08T10:00:00+03:00" }, end: { dateTime: "2026-10-08T11:00:00+03:00" } }
                - { id: e2, summary: "Стоматолог", start: { dateTime: "2026-10-09T10:00:00+03:00" }, end: { dateTime: "2026-10-09T11:00:00+03:00" } }
                - { id: e3, summary: "Английский", start: { dateTime: "2026-10-13T19:00:00+03:00" }, end: { dateTime: "2026-10-13T20:00:00+03:00" } }
    - document:
        from: 1001
        file_name: "booking.ics"
        mime_type: "text/calendar"
        # Свёрнутая строка (продолжение с пробела), экранированные запятые, вложенный VALARM
        content: |
          BEGIN:VCALENDAR
          VERSION:2.0
          PRODID:-//Clinic//Booking//RU
          BEGIN:VEVENT
          UID:booking-123@clinic.example
          DTSTART:20261014T063000Z
          DTEND:20261014T071500Z
          SUMMARY:Приём у стоматолога\, д-р Иванова
          LOCATION:ул. Ленина 5\, каб. 12
          DESCRIPTION:Возьмите паспорт. Подробнее: https://clinic.ex
           ample/booking/123
          BEGIN:VALARM
          TRIGGER:-PT1H
          ACTION:DISPLAY
          END:VALARM
          END:VEVENT
          END:VCALENDAR
    - expect_telegram:
        - text_contains: ["Добавить в календарь?", "<b>Приём у стоматолога, д-р Иванова</b>", "ср, 14 октября, 09:30–10:15", "📍 ул. Ленина 5, каб. 12"]
          buttons: ["Добавить", "Отмена"]
    # Без LLM и без vision
    - expect_llm_requests: 0
    - expect_vision_requests: 0
    - press: "Добавить"
    - expect_telegram:
        - { method: editMessageText, text_contains: ["✅ Добавлено", "Приём у стоматолога"], buttons: ["Открыть в календаре", "↩ Отменить"] }
    - expect_google_events:
        email: ivan@gmail.com
        calendar: ivan@gmail.com
        count: 4
        events:
          - summary: "Приём у стоматолога, д-р Иванова"
            start: "2026-10-14T09:30:00+03:00"
            end: "2026-10-14T10:15:00+03:00"
            location: "ул. Ленина 5, каб. 12"
            description: "Возьмите паспорт. Подробнее: https://clinic.example/booking/123"
    # Повторное нажатие — второго события нет
    - press: "Добавить"
    - expect_callback_answer: { text_contains: ["Уже сделано"] }

- id: ics-multiple-events-with-tzid
  story: US-67
  steps:
    - *setup
    - document:
        from: 1001
        file_name: "invite.ics"
        content: |
          BEGIN:VCALENDAR
          VERSION:2.0
          PRODID:Microsoft Exchange Server 2010
          BEGIN:VTIMEZONE
          TZID:Russian Standard Time
          BEGIN:STANDARD
          DTSTART:16010101T000000
          TZOFFSETFROM:+0300
          TZOFFSETTO:+0300
          END:STANDARD
          END:VTIMEZONE
          BEGIN:VEVENT
          UID:q-planning
          SUMMARY;LANGUAGE=ru-RU:Планирование квартала
          DTSTART;TZID=Russian Standard Time:20261020T150000
          DTEND;TZID=Russian Standard Time:20261020T163000
          END:VEVENT
          BEGIN:VEVENT
          UID:weekly-1
          SUMMARY:Немецкий
          DTSTART;TZID=Europe/Berlin:20261019T090000
          DURATION:PT45M
          RRULE:FREQ=WEEKLY;BYDAY=MO;COUNT=10
          END:VEVENT
          END:VCALENDAR
    - expect_telegram:
        - text_contains: ["Добавить в календарь событий: 2?", "<b>Планирование квартала</b>", "вт, 20 октября, 15:00–16:30", "<b>Немецкий</b>", "пн, 19 октября, 10:00–10:45", "🔁 повторяется"]
          buttons: ["Добавить все (2)", "Отмена"]
    - press: "Добавить все (2)"
    - expect_telegram:
        - { method: editMessageText, text_contains: ["✅ Добавлено событий: 2"] }
    - expect_google_events:
        email: ivan@gmail.com
        calendar: ivan@gmail.com
        count: 5
        events:
          - { summary: "Планирование квартала", start: "2026-10-20T15:00:00+03:00", end: "2026-10-20T16:30:00+03:00" }
          - summary: "Немецкий"
            start: "2026-10-19T10:00:00+03:00"
            end: "2026-10-19T10:45:00+03:00"
            recurrence: ["RRULE:FREQ=WEEKLY;BYDAY=MO;COUNT=10"]

- id: ics-all-day-and-cancel
  story: US-67
  steps:
    - *setup
    - document:
        from: 1001
        file_name: "vacation.ics"
        content: |
          BEGIN:VCALENDAR
          VERSION:2.0
          BEGIN:VEVENT
          UID:trip-1
          SUMMARY:Отпуск
          DTSTART;VALUE=DATE:20261102
          DTEND;VALUE=DATE:20261109
          END:VEVENT
          END:VCALENDAR
    - expect_telegram:
        - { text_contains: ["<b>Отпуск</b>", "пн, 2 ноября — вс, 8 ноября, весь день"] }
    - press: "Отмена"
    - expect_telegram:
        - { method: editMessageText, text_contains: ["Отменено"] }
    - expect_google_events: { email: ivan@gmail.com, calendar: ivan@gmail.com, count: 3, events: [] }
    - document:
        from: 1001
        file_name: "vacation.ics"
        content: |
          BEGIN:VCALENDAR
          BEGIN:VEVENT
          SUMMARY:Отпуск
          DTSTART;VALUE=DATE:20261102
          DTEND;VALUE=DATE:20261109
          END:VEVENT
          END:VCALENDAR
    - press: "Добавить"
    - expect_google_events:
        email: ivan@gmail.com
        calendar: ivan@gmail.com
        events:
          - { summary: "Отпуск", start: "2026-11-02", end: "2026-11-09" }

- id: ics-malformed-and-empty
  story: US-67
  steps:
    - *setup
    - document: { from: 1001, file_name: "broken.ics", content: "Это не календарь, а просто текст." }
    - expect_telegram:
        - { text_contains: ["Не смог прочитать файл .ics"] }
    - document:
        from: 1001
        file_name: "empty.ics"
        content: |
          BEGIN:VCALENDAR
          BEGIN:VEVENT
          SUMMARY:Без даты
          END:VEVENT
          END:VCALENDAR
    - expect_telegram:
        - { text_contains: ["В файле нет событий, которые можно добавить"] }
    # Не .ics и не картинка — как раньше, «пока не умею»
    - document: { from: 1001, file_name: "report.pdf", mime_type: "application/pdf", content: "%PDF-1.4" }
    - expect_telegram:
        - { text_contains: ["пока не умею"] }
    - expect_llm_requests: 0

- id: digest-tomorrow-off-by-default-then-on
  story: US-70
  steps:
    - *setup
    # По умолчанию «Завтра» выключена: в 21:00 ничего не приходит
    - clock: "2026-10-07T18:00:00Z"
    - tick: true
    - hourly: true
    - tick: true
    - expect_no_telegram: true
    - telegram: { from: 1001, text: "/settings" }
    - press: "☀️ Сводка"
    - press: "🌙 Завтра в 21:00"
    - expect_telegram:
        - { text_contains: ["☀️ Утренняя сводка: в 08:00", "🌙 Сводка на завтра: выключена", "🗓 Сводка на неделю: выключена"] }
        - { method: editMessageText, text_contains: ["Утренняя сводка</b>", "<b>Завтра</b>"] }
        - method: editMessageText
          buttons: ["06:00", "06:30", "07:00", "07:30", "✓ 08:00", "08:30", "09:00", "09:30", "10:00", "Другое время…", "Выключить", "✓ 🌙 Завтра в 21:00", "✓ 🗓 Неделя: нет", "вс 20:00", "пн 08:00", "← Назад"]
    - expect_callback_answer: { text_contains: ["Сохранено"] }
    # Чт 8 октября, 21:00 МСК — события на пт 9 октября
    - clock: "2026-10-08T17:59:00Z"
    - tick: true
    - expect_no_telegram: true
    - clock: "2026-10-08T18:00:00Z"
    - tick: true
    - expect_telegram:
        - { text_contains: ["🌙 Что завтра:", "Завтра, пт, 9 октября", "10:00–11:00  Стоматолог"], text_not_contains: ["Планёрка"] }
    # Пт 9 октября — на субботу пусто
    - clock: "2026-10-09T18:00:00Z"
    - tick: true
    - expect_telegram:
        - { text_contains: ["🌙 Завтра встреч нет."] }

- id: digest-week-sunday-and-monday
  story: US-70
  steps:
    - *setup
    # Утреннюю выключаем, чтобы в понедельник 08:00 пришла только недельная
    - telegram: { from: 1001, text: "/settings" }
    - press: "☀️ Сводка"
    - press: "Выключить"
    - press: "☀️ Сводка"
    - press: "вс 20:00"
    - expect_telegram:
        - { text_contains: ["Настройки"] }
        - { method: editMessageText }
        - { method: editMessageText, text_contains: ["☀️ Утренняя сводка: выключена"] }
        - { method: editMessageText }
        - method: editMessageText
          buttons: ["06:00", "06:30", "07:00", "07:30", "08:00", "08:30", "09:00", "09:30", "10:00", "Другое время…", "🌙 Завтра в 21:00", "🗓 Неделя: нет", "✓ вс 20:00", "пн 08:00", "← Назад"]
    # Вс 11 октября, 20:00 МСК — предстоящая неделя пн 12 – вс 18
    - clock: "2026-10-11T16:59:00Z"
    - tick: true
    - expect_no_telegram: true
    - clock: "2026-10-11T17:00:00Z"
    - tick: true
    - expect_telegram:
        - { text_contains: ["🗓 Ваша неделя:", "Вт, 13 октября", "19:00–20:00  Английский"], text_not_contains: ["Стоматолог"] }
    # Переключить на понедельник 08:00 — текущая неделя
    - telegram: { from: 1001, text: "/settings" }
    - expect_telegram:
        - { text_contains: ["🗓 Сводка на неделю: вс в 20:00"] }
    - press: "☀️ Сводка"
    - press: "пн 08:00"
    - clock: "2026-10-12T05:00:00Z"
    - tick: true
    - expect_telegram:
        - { method: editMessageText }
        - { method: editMessageText }
        - { text_contains: ["🗓 Ваша неделя:", "Английский"] }
    # Следующая неделя пустая
    - clock: "2026-10-19T05:00:30Z"
    - tick: true
    - expect_telegram:
        - { text_contains: ["🗓 На неделе встреч нет."] }
