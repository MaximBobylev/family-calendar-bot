# Панель «Квоты» (docs/admin-console.md, «Квоты»): остатки у провайдеров без траты квоты моделей — бесплатные
# эндпоинты остатков (OpenRouter /key, DeepSeek /user/balance; в dev это звенья «openrouter» и «deepseek» цепочки LLM),
# GraphQL Analytics Cloudflare (neurons Workers AI, запросы Workers, строки D1, операции Queues; в dev — фейк по
# CF_GRAPHQL_URL), заголовки лимитов настоящих вызовов (Groq) и оценки по журналу (Gemini). Ключи на странице не видны.
# Низкий остаток — алерт владельцу quota_low. «Сейчас» — пт 9 октября 2026, 18:30 МСК.

- id: quotas-panel-sources-and-cache
  story: ADR-0002
  steps:
    - clock: "2026-10-09T15:30:00Z"
    - connected_user:
        from: 1001
        email: ivan@gmail.com
        calendars: [{ id: ivan@gmail.com, summary: "Иван", accessRole: owner, primary: true, timeZone: Europe/Moscow, events: [] }]
    - llm:
        "Что у меня завтра?": { tool: list_events, args: { range: "завтра" } }
    # Голосовое — через Groq: его ответ несёт x-ratelimit-*-requests (суточные запросы)
    - voice: { from: 1001, transcript: "Что у меня завтра?" }
    - http_get:
        path: "/admin/quotas"
        basic_auth: "admin:test-admin-password"
        text_contains:
          - "Квоты провайдеров"
          - "OpenRouter"
          - "Бесплатные модели (:free), запросов в сутки"
          - "38</b> из 50 (76%)"
          - "DeepSeek"
          - "$4.20"
          - "Workers AI"
          - "Бесплатные neurons в сутки (аккаунт)"
          - "8766</b> из 10000 (88%)"
          - "по журналу бота ≈ 0"
          - "Тариф Cloudflare Workers: <b>Free</b>"
          - "CF_WORKERS_PLAN"
          - "Запросов в сутки (аккаунт, все Worker&#39;ы)"
          - "96500</b> из 100000 (97%)"
          - "calendar-assist-bot: 3000 (ошибок 3, 0.1%; подзапросов 4500)"
          - "CPU на вызов, p99 (calendar-assist-bot)"
          - "3.5</b> из 10 (35%)"
          - "p50 1.8 мс"
          - "Строк прочитано в сутки (аккаунт)"
          - "4750000</b> из 5000000 (95%)"
          - "Строк записано в сутки (аккаунт)"
          - "88000</b> из 100000 (88%)"
          - "Хранилище (все базы)"
          - "4987.5</b> из 5000"
          - "Операций в сутки (аккаунт)"
          - "7900</b> из 10000 (79%)"
          - "WriteMessage 700, ReadMessage 700, DeleteMessage 700"
          - "оценка по журналу"
          - "Account Analytics: Read"
          - "Groq"
          - "1990</b> из 2000"
          - "заголовки последнего вызова · 2026-10-09 15:30 UTC"
          - "x-ratelimit-remaining-requests: 1990"
          - "Gemini"
          - "Вызовов сегодня (с 00:00 по Тихоокеанскому)"
          - "2026-10-10 07:00 UTC"
          - "Google Calendar API"
          - "запрошены"
        text_not_contains: ["test-llm-key", "test-stt-key", "test-gemini-key", "sk-or-v1", "не удалось получить", "0123456789abcdef"]
    # OpenRouter, DeepSeek и четыре запроса GraphQL (neurons, Workers, D1, Queues)
    - expect_quota_requests: 6
    # Повтор в течение минуты — из кеша, провайдеров не дёргаем
    - http_get:
        path: "/admin/quotas"
        basic_auth: "admin:test-admin-password"
        text_contains: ["из кеша", "38</b> из 50", "96500</b> из 100000"]
    - expect_quota_requests: 6
    - clock: "2026-10-09T15:32:00Z"
    - http_get: { path: "/admin/quotas", basic_auth: "admin:test-admin-password", text_contains: ["запрошены"] }
    - expect_quota_requests: 12

- id: quotas-provider-failure-does-not-break-page
  story: ADR-0002
  steps:
    - clock: "2026-10-09T15:30:00Z"
    - http_get: { path: "/admin/quotas", expect_status: 401 }
    # OpenRouter лежит, у токена нет права на аналитику Cloudflare — остальное на месте, neurons — оценкой по журналу
    - fake_quotas: { openrouter_status: 500, cf_error: "not authorized for that account" }
    - http_get:
        path: "/admin/quotas"
        basic_auth: "admin:test-admin-password"
        text_contains:
          - "OpenRouter"
          - "не удалось получить: HTTP 500"
          - "DeepSeek"
          - "$4.20"
          - "Workers AI"
          - "оценка по журналу"
          - "не удалось получить: GraphQL: not authorized for that account — токену CF_ANALYTICS_TOKEN (или LLM_API_KEY) нужно право Account Analytics: Read"
          - "Queues"
        text_not_contains: ["test-llm-key", "96500"]

- id: quotas-low-alert-and-429-headers
  story: ADR-0002
  steps:
    - clock: "2026-10-09T15:30:00Z"
    - connected_user:
        from: 1002
        email: maria@gmail.com
        calendars: [{ id: maria@gmail.com, summary: "Мария", accessRole: owner, primary: true, timeZone: Europe/Moscow, events: [] }]
    - alerts: { expect_sent: [] }
    - expect_no_telegram: true
    # OpenRouter исчерпал бесплатные запросы (429 с заголовками лимита) — команда ушла в запасной DeepSeek
    - provider_outage: { provider: llm, status: 429 }
    - llm:
        "Что у меня завтра?": { tool: list_events, args: { range: "завтра" } }
    - telegram: { from: 1002, text: "Что у меня завтра?" }
    - expect_provider_calls: { llm: 1, llm-backup: 1 }
    - expect_telegram:
        - { chat_id: 1002, text_contains: ["Завтра, сб, 10 октября"] }
    - fake_quotas:
        openrouter: { data: { limit: null, usage: 0, usage_daily: 0, is_free_tier: true, free_model_daily_requests: { used: 46, limit: 50, remaining: 4 } } }
        deepseek: { is_available: true, balance_infos: [{ currency: "USD", total_balance: "0.40", granted_balance: "0.00", topped_up_balance: "0.40" }] }
    - clock: "2026-10-09T15:35:00Z"
    - http_get:
        path: "/admin/quotas"
        basic_auth: "admin:test-admin-password"
        text_contains: ['<b class="warn">4</b> из 50', '<b class="err">$0.40</b>', "x-ratelimit-remaining: 0", '<span class="err">429</span>']
    - alerts: { expect_sent: ["quota_low:fire"] }
    - expect_telegram:
        - chat_id: 1001
          text_contains: ["🔴 Алерт: квоты провайдеров на исходе", "OpenRouter: 4 запр. из 50", "DeepSeek: 0.40 $"]
          text_not_contains: ["test-llm-key", "sk-or"]
    # Пополнили баланс, сутки сменились — «восстановлено»
    - fake_quotas:
        openrouter: { data: { limit: null, usage: 0, usage_daily: 0, is_free_tier: true, free_model_daily_requests: { used: 0, limit: 50, remaining: 50 } } }
        deepseek: { is_available: true, balance_infos: [{ currency: "USD", total_balance: "10.00" }] }
    - clock: "2026-10-10T00:05:00Z"
    - alerts: { expect_sent: ["quota_low:resolve"] }

- id: quotas-cloudflare-platform-alert
  story: ADR-0002
  steps:
    - clock: "2026-10-09T15:30:00Z"
    - alerts: { expect_sent: [] }
    - expect_no_telegram: true
    # Вечер пятницы: запросы Workers, строки D1 и операции очереди — за 80% суточных лимитов Free
    - fake_quotas:
        cf_workers:
          workersInvocationsAdaptive:
            - { dimensions: { scriptName: calendar-assist-bot }, sum: { requests: 85000, errors: 12, subrequests: 9000 }, quantiles: { cpuTimeP50: 2000, cpuTimeP99: 25800 } }
        cf_d1:
          d1AnalyticsAdaptiveGroups: [{ dimensions: { databaseId: db-1 }, sum: { rowsRead: 4500000, rowsWritten: 90000, readQueries: 9000, writeQueries: 3000 } }]
          d1StorageAdaptiveGroups: [{ dimensions: { databaseId: db-1 }, max: { databaseSizeBytes: 700000 } }]
        cf_queues:
          queueMessageOperationsAdaptiveGroups: [{ dimensions: { actionType: WriteMessage }, sum: { billableOperations: 9000 } }]
    - clock: "2026-10-09T15:35:00Z"
    - http_get:
        path: "/admin/quotas"
        basic_auth: "admin:test-admin-password"
        # CPU выше лимита Free — жёлтый, не красный: Cloudflare допускает всплески
        text_contains: ['<b class="warn">15000</b> из 100000', '<b class="warn">0</b> из 10', '<b class="warn">10000</b> из 100000', '<b class="warn">1000</b> из 10000']
    - alerts: { expect_sent: ["quota_low:fire"] }
    - expect_telegram:
        - chat_id: 1001
          text_contains: ["квоты провайдеров на исходе", "Workers: 15000 запр. из 100000", "D1: 500000 строк из 5000000", "D1: 10000 строк из 100000", "Queues: 1000 опер. из 10000"]
          text_not_contains: ["test-llm-key", "CPU"]
    # Новые сутки UTC — счётчики обнулились
    - fake_quotas:
        cf_workers: { workersInvocationsAdaptive: [] }
        cf_d1: { d1AnalyticsAdaptiveGroups: [], d1StorageAdaptiveGroups: [] }
        cf_queues: { queueMessageOperationsAdaptiveGroups: [] }
    - clock: "2026-10-10T00:05:00Z"
    - alerts: { expect_sent: ["quota_low:resolve"] }
