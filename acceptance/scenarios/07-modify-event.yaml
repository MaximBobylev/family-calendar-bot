# Реальный Qwen3 (замер 2026-10-04): не заполняет «event», выдумывает reference/scope, путает с созданием.
- id: modify-llm-hallucinated-reference-ignored
  story: ADR-0005
  steps:
    - *setup
    - llm:
        "Сдвинь планёрку на час позже": { tool: modify_event, args: { reference: "last" } }
        "Перенеси обед на завтра": { tool: create_event, args: { start: "на завтра", title: "обед" } }
    - telegram: { from: 1001, text: "Сдвинь планёрку на час позже" }
    - expect_telegram:
        - { text_contains: ["<b>Планёрка</b>", "Стало: чт, 8 октября, 11:00–12:00"] }
    - telegram: { from: 1001, text: "Перенеси обед на завтра" }
    - expect_telegram:
        - { method: editMessageText, text_contains: ["Отменено"] }
        - { text_contains: ["Перенести?", "<b>Обед</b>", "Стало: чт, 8 октября, 13:00–14:00"] }
