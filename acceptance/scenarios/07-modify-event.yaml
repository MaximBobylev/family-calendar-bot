# US-40, US-41, US-43: перенос и изменение событий. US-60: контекст. «Сейчас» — ср 7 октября 2026, 10:00 МСК.

- id: modify-move-to-tomorrow-keeps-time
  story: US-40
  steps:
    - &setup
      - clock: "2026-10-07T07:00:00Z"
      - connected_user:
          from: 1001
          email: ivan@gmail.com
          calendars:
            - id: ivan@gmail.com
              summary: "Иван"
              accessRole: owner
              primary: true
              timeZone: Europe/Moscow
              events:
                - { id: e1, summary: "Планёрка", start: { dateTime: "2026-10-08T10:00:00+03:00" }, end: { dateTime: "2026-10-08T11:00:00+03:00" } }
                - id: e2
                  summary: "Созвон с Петей"
                  start: { dateTime: "2026-10-08T15:00:00+03:00" }
                  end: { dateTime: "2026-10-08T15:30:00+03:00" }
                  organizer: { self: true }
                  attendees: [{ self: true, responseStatus: accepted }, { email: "petya@example.com", responseStatus: accepted }]
                - { id: e3, summary: "Обед", start: { dateTime: "2026-10-09T13:00:00+03:00" }, end: { dateTime: "2026-10-09T14:00:00+03:00" } }
                - id: e4
                  summary: "Встреча у клиента"
                  start: { dateTime: "2026-10-08T12:00:00+03:00" }
                  end: { dateTime: "2026-10-08T13:00:00+03:00" }
                  organizer: { self: false, email: "client@example.com" }
                  attendees: [{ self: true, responseStatus: accepted }, { email: "client@example.com" }]
                - { id: e6, summary: "Созвон с Машей", start: { dateTime: "2026-10-09T16:00:00+03:00" }, end: { dateTime: "2026-10-09T16:30:00+03:00" } }
                # Серия «Стендап» по понедельникам: мастер (5 окт) и экземпляр 12 окт
                - { id: s1, summary: "Стендап", recurrence: ["RRULE:FREQ=WEEKLY;BYDAY=MO"], start: { dateTime: "2026-10-05T11:00:00+03:00" }, end: { dateTime: "2026-10-05T11:15:00+03:00" } }
                - { id: s1_20261012, recurringEventId: s1, summary: "Стендап", start: { dateTime: "2026-10-12T11:00:00+03:00" }, end: { dateTime: "2026-10-12T11:15:00+03:00" } }
      - llm:
          "Перенеси обед на завтра": { tool: modify_event, args: { event: "обед" } }
          "Сдвинь планёрку на час позже": { tool: modify_event, args: { event: "планёрку" } }
          "Перенеси планёрку на 3": { tool: modify_event, args: { event: "планёрку" } }
          "Перенеси созвон с Петей на 16": { tool: modify_event, args: { event: "созвон с Петей" } }
          "Перенеси встречу у клиента на 14": { tool: modify_event, args: { event: "встречу у клиента" } }
          "Перенеси созвон на час позже": { tool: modify_event, args: { event: "созвон" } }
          "Перенеси встречу с Олегом на пятницу": { tool: modify_event, args: { event: "встречу с Олегом" } }
          "Переименуй планёрку в Стендап команды": { tool: modify_event, args: { event: "планёрку" } }
          "Перенеси стендап на 12": { tool: modify_event, args: { event: "стендап" } }
          "Перенеси все стендапы на среду": { tool: modify_event, args: { event: "стендапы" } }
          "Что у меня завтра?": { tool: list_events, args: { range: "завтра" } }
          "Перенеси третью на час позже": { tool: modify_event, args: {} }
          "Сдвинь завтрашнюю встречу в 15 на полчаса позже": { tool: modify_event, args: {} }
          "Перенеси планёрку на вчера": { tool: modify_event, args: { event: "планёрку" } }
          "Сделай планёрку на полтора часа": { tool: modify_event, args: { event: "планёрку" } }
    - telegram: { from: 1001, text: "Перенеси обед на завтра" }
    - expect_telegram:
        - text_contains: ["Перенести?", "<b>Обед</b>", "Было: пт, 9 октября, 13:00–14:00", "Стало: чт, 8 октября, 13:00–14:00"]
          text_not_contains: ["Участники"]
          buttons: ["Подтвердить", "Отмена"]
    - press: "Подтвердить"
    - expect_telegram:
        - { method: editMessageText, text_contains: ["✅ Изменено", "чт, 8 октября, 13:00–14:00"] }
    - expect_google_events:
        email: ivan@gmail.com
        calendar: ivan@gmail.com
        events: [{ summary: "Обед", start: "2026-10-08T13:00:00+03:00", end: "2026-10-08T14:00:00+03:00" }]
    - expect_google_patches: { count: 1, id: e3, sendUpdates: none }

