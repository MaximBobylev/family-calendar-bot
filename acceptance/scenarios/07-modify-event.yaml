- id: modify-last-created
  story: US-60
  steps:
    - *setup
    - llm:
        "Поставь встречу с Машей в пятницу в 11": { tool: create_event, args: { start: "в пятницу в 11", title: "Встреча с Машей" } }
        "Перенеси её на час позже": { tool: modify_event, args: { reference: "last" } }
    - telegram: { from: 1001, text: "Поставь встречу с Машей в пятницу в 11" }
    - press: "Создать"
    - telegram: { from: 1001, text: "Перенеси её на час позже" }
    - expect_telegram:
        - { text_contains: ["Создать событие?"] }
        - { method: editMessageText, text_contains: ["✅ Создано"] }
        - { text_contains: ["<b>Встреча с Машей</b>", "Было: пт, 9 октября, 11:00–12:00", "Стало: пт, 9 октября, 12:00–13:00"] }

