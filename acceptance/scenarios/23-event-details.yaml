- id: details-reminders-set-and-undo
  story: US-42
  steps:
    - *setup
    - telegram: { from: 1001, text: "Поставь напоминания за час и за сутки до планёрки" }
    - expect_telegram:
        - text_contains: ["Изменить?", "<b>Планёрка</b>", "🔔 Напоминания: как в календаре → за 1 ч, за 1 дн."]
          buttons: ["Подтвердить", "Отмена"]
    - press: "Подтвердить"
    - expect_telegram:
        - { method: editMessageText, text_contains: ["✅ Изменено", "🔔 за 1 ч, за 1 дн."] }
    - expect_google_events:
        email: ivan@gmail.com
        calendar: ivan@gmail.com
        events:
          - summary: "Планёрка"
            start: "2026-10-08T10:00:00+03:00"
            end: "2026-10-08T11:00:00+03:00"
            reminders: { useDefault: false, overrides: [{ method: popup, minutes: 60 }, { method: popup, minutes: 1440 }] }
    # Отмена возвращает напоминания «как в календаре»
    - press: "↩ Отменить"
    - expect_google_events:
        email: ivan@gmail.com
        calendar: ivan@gmail.com
        events: [{ summary: "Планёрка", start: "2026-10-08T10:00:00+03:00", end: "2026-10-08T11:00:00+03:00", reminders: { useDefault: true, overrides: [] } }]

