# US-41: место и описание события. US-42: напоминания конкретного события. US-61: отмена возвращает прежнее.
# «Сейчас» — ср 7 октября 2026, 10:00 МСК.

- id: details-location-for-last-event
  story: US-41
  steps:
    - &setup
      - clock: "2026-10-07T07:00:00Z"
      - connected_user:
          from: 1001
          email: ivan@gmail.com
          calendars:
            - id: ivan@gmail.com
              summary: "Иван"
              accessRole: owner
              primary: true
              timeZone: Europe/Moscow
              events:
                - { id: e1, summary: "Планёрка", start: { dateTime: "2026-10-08T10:00:00+03:00" }, end: { dateTime: "2026-10-08T11:00:00+03:00" } }
                - id: e3
                  summary: "Обед"
                  location: "Столовая"
                  reminders: { useDefault: false, overrides: [{ method: popup, minutes: 30 }] }
                  start: { dateTime: "2026-10-09T13:00:00+03:00" }
                  end: { dateTime: "2026-10-09T14:00:00+03:00" }
                - { id: e6, summary: "Созвон с Машей", start: { dateTime: "2026-10-09T16:00:00+03:00" }, end: { dateTime: "2026-10-09T16:30:00+03:00" } }
                - { id: e7, summary: "Встреча с юристом", description: "Офис 5", start: { dateTime: "2026-10-07T12:00:00+03:00" }, end: { dateTime: "2026-10-07T13:00:00+03:00" } }
                - { id: s1, summary: "Стендап", recurrence: ["RRULE:FREQ=WEEKLY;BYDAY=MO"], start: { dateTime: "2026-10-05T11:00:00+03:00" }, end: { dateTime: "2026-10-05T11:15:00+03:00" } }
                - { id: s1_20261012, recurringEventId: s1, summary: "Стендап", start: { dateTime: "2026-10-12T11:00:00+03:00" }, end: { dateTime: "2026-10-12T11:15:00+03:00" } }
            - id: family@group.calendar.google.com
              summary: "Семья"
              accessRole: writer
              events: []
      - llm:
          "Когда у меня планёрка?": { tool: find_event, args: { event: "планёрка" } }
          # Живая модель может принять «добавь …» за создание — код поправляет (effectiveIntent)
          "Добавь место: кафе Пушкин": { tool: create_event, args: { start: "", title: "Место кафе Пушкин" } }
          "Обед в пятницу будет в офисе на Лесной": { tool: modify_event, args: { event: "обед", new_location: "офис на Лесной" } }
          "Обед в пятницу будет в семейном календаре": { tool: modify_event, args: { event: "обед", new_location: "семейный календарь" } }
          "Добавь к встрече в 12 описание: взять документы": { tool: modify_event, args: {} }
          "Поставь напоминания за час и за сутки до планёрки": { tool: modify_event, args: { event: "планёрки" } }
          "Убери напоминания с обеда": { tool: delete_event, args: { event: "обед" } }
          "Напомни на почту за день до созвона с Машей": { tool: create_event, args: { start: "за день", title: "Созвон с Машей" } }
          "Напомни за 5 недель до планёрки": { tool: modify_event, args: {} }
          "Напомни за 5 минут, за 10 минут, за 15 минут, за 30 минут, за час и за день до планёрки": { tool: modify_event, args: {} }
          "Напомни за 15 минут до стендапа": { tool: modify_event, args: { event: "стендап" } }
    - telegram: { from: 1001, text: "Когда у меня планёрка?" }
    - expect_telegram:
        - { text_contains: ["Ближайшее:", "Планёрка"] }
    # Событие не названо — последнее показанное (US-60)
    - telegram: { from: 1001, text: "Добавь место: кафе Пушкин" }
    - expect_telegram:
        - text_contains: ["Изменить?", "<b>Планёрка</b>", "📍 Место: кафе Пушкин"]
          text_not_contains: ["Было:"]
          buttons: ["Подтвердить", "Отмена"]
    - press: "Подтвердить"
    - expect_telegram:
        - { method: editMessageText, text_contains: ["✅ Изменено", "📍 кафе Пушкин"] }
    - expect_google_events:
        email: ivan@gmail.com
        calendar: ivan@gmail.com
        events: [{ summary: "Планёрка", location: "кафе Пушкин", start: "2026-10-08T10:00:00+03:00", end: "2026-10-08T11:00:00+03:00" }]
    - press: "↩ Отменить"
    - expect_telegram:
        - { method: editMessageText, text_contains: ["↩ Отменено"] }
    - expect_google_events:
        email: ivan@gmail.com
        calendar: ivan@gmail.com
        events: [{ summary: "Планёрка", location: "", start: "2026-10-08T10:00:00+03:00", end: "2026-10-08T11:00:00+03:00" }]

