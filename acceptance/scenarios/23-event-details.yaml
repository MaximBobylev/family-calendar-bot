    - expect_google_patches: { count: 0 }

- id: details-reminders-whole-series
  story: US-42
  steps:
    - *setup
    - telegram: { from: 1001, text: "Напомни за 15 минут до стендапа" }
    - expect_telegram:
        - text_contains: ["Изменить?", "<b>Стендап</b>", "🔔 Напоминания: как в календаре → за 15 мин"]
          buttons: ["Только эту", "Всю серию", "Отмена"]
    - press: "Всю серию"
    - expect_telegram:
        - { method: editMessageText, text_contains: ["✅ Изменено", "Изменена вся серия"] }
    - expect_google_patches: { count: 1, id: s1 }
    - expect_google_events:
        email: ivan@gmail.com
        calendar: ivan@gmail.com
        events:
          - { summary: "Стендап", start: "2026-10-05T11:00:00+03:00", end: "2026-10-05T11:15:00+03:00", reminders: { useDefault: false, overrides: [{ method: popup, minutes: 15 }] } }
