- id: details-reminders-google-limits
  story: US-42
  steps:
    - *setup
    - telegram: { from: 1001, text: "Напомни за 5 недель до планёрки" }
    - expect_telegram:
        - { text_contains: ["раньше чем за 4 недели"] }
    - telegram: { from: 1001, text: "Напомни за 5 минут, за 10 минут, за 15 минут, за 30 минут, за час и за день до планёрки" }
    - expect_telegram:
