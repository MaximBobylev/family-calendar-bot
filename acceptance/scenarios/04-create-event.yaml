# Поведение реального Qwen3 на Workers AI (замер 2026-10-04): теряет части дат, не заполняет длительность,
# ломает JSON. Даты берутся из текста детерминированно (src/dates/extract.ts) — бот не ошибается.

- id: create-llm-dropped-day-and-duration
  story: ADR-0005
  steps:
    - *setup
    - llm:
        "Созвон с Петей завтра в 15:30 на полчаса": { tool: create_event, args: { start: "в 15:30", title: "Созвон с Петей" } }
        "Обед в пятницу с часу до двух": { tool: create_event, args: { start: "с часу до двух", title: "Обед" } }
    - telegram: { from: 1001, text: "Созвон с Петей завтра в 15:30 на полчаса" }
    - expect_telegram:
        - { text_contains: ["Созвон с Петей", "чт, 8 октября, 15:30–16:00"] }
    - telegram: { from: 1001, text: "Обед в пятницу с часу до двух" }
    - expect_telegram:
        - { method: editMessageText, text_contains: ["Отменено"] }
        - { text_contains: ["Обед", "пт, 9 октября, 13:00–14:00"] }

