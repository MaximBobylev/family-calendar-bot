- id: create-on-weekend-asks-time-then-day
  story: US-30
  steps:
    - *setup
    # «в выходные» при создании — суббота или воскресенье кнопками, без «весь день» (решение 2026-10-05)
    - telegram: { from: 1001, text: "Встреча с Машей в выходные" }
    - expect_telegram:
        - { text_contains: ["Во сколько?"] }
    - telegram: { from: 1001, text: "в 12" }
    - expect_telegram:
        - { text_contains: ["Когда именно?", "<b>Встреча с Машей</b>"], buttons: ["сб, 10 октября, 12:00–13:00", "вс, 11 октября, 12:00–13:00", "Отмена"] }
