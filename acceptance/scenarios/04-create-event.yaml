    - press: "Создать"
    - expect_telegram:
        - { method: editMessageText, text_contains: ["✅ Создано"] }
        - { text_contains: ["Как назвать встречу?"] }
    - reply: { from: 1001, text: "Ревью дизайна" }
    - expect_telegram:
        - { text_contains: ["назвал «Ревью дизайна»"] }
    - expect_google_events:
        email: ivan@gmail.com
        calendar: ivan@gmail.com
        events: [{ summary: "Ревью дизайна", start: "2026-10-09T15:00:00+03:00", end: "2026-10-09T16:00:00+03:00" }]

