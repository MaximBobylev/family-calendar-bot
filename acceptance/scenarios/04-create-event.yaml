# US-30, US-31: создание события. US-05: карточки и кнопки. «Сейчас» — ср 7 октября 2026, 10:00 МСК.

- id: create-with-confirmation
  story: US-30
  steps:
    - &setup
      - clock: "2026-10-07T07:00:00Z"
      - connected_user:
          from: 1001
          email: ivan@gmail.com
          calendars:
            - id: ivan@gmail.com
              summary: "Иван"
              accessRole: owner
              primary: true
              timeZone: Europe/Moscow
              events:
                - { id: e1, summary: "Планёрка", start: { dateTime: "2026-10-08T10:00:00+03:00" }, end: { dateTime: "2026-10-08T11:00:00+03:00" } }
            - { id: family@group.calendar.google.com, summary: "Семья", accessRole: writer, timeZone: Europe/Moscow }
            - { id: holidays@group.v.calendar.google.com, summary: "Праздники", accessRole: reader }
      - llm:
          "Созвон с Петей завтра в 15:30 на полчаса": { tool: create_event, args: { start: "завтра в 15:30", title: "Созвон с Петей", duration: "на полчаса" } }
          "Поставь встречу в пятницу в 3": { tool: create_event, args: { start: "в пятницу в 3" } }
          "Поставь встречу на среду в 12": { tool: create_event, args: { start: "на среду в 12" } }
          "Поставь встречу завтра в 10:30": { tool: create_event, args: { start: "завтра в 10:30" } }
          "Завтра день рождения мамы": { tool: create_event, args: { start: "завтра", title: "День рождения мамы", all_day: true } }
          "Отпуск с 10 по 20 ноября": { tool: create_event, args: { start: "с 10 по 20 ноября", title: "Отпуск", all_day: true } }
          "Поставь встречу с Машей в пятницу": { tool: create_event, args: { start: "в пятницу", title: "Встреча с Машей" } }
          "Поставь звонок сегодня в 8 утра": { tool: create_event, args: { start: "сегодня в 8 утра", title: "Звонок" } }
          "Ужин в семейный календарь в субботу в 19": { tool: create_event, args: { start: "в субботу в 19", title: "Ужин", calendar: "Семья" } }
          "Поставь в праздники встречу завтра в 12": { tool: create_event, args: { start: "завтра в 12", calendar: "Праздники" } }
          "Обед в пятницу с часу до двух": { tool: create_event, args: { start: "в пятницу с часу до двух", title: "Обед" } }
          "Что у меня завтра?": { tool: list_events, args: { range: "завтра" } }
    - telegram: { from: 1001, text: "Созвон с Петей завтра в 15:30 на полчаса" }
    - expect_telegram:
        - text_contains: ["Создать событие?", "<b>Созвон с Петей</b>", "чт, 8 октября, 15:30–16:00", "🗓 Иван"]
          text_not_contains: ["Пересекается"]
          buttons: ["Создать", "Отмена"]
    - press: "Создать"
    - expect_callback_answer: { empty: true }
    - expect_telegram:
        - { method: editMessageText, text_contains: ["✅ Создано", "Созвон с Петей", "15:30–16:00"], buttons: ["Открыть в календаре"] }
    - expect_google_events:
        email: ivan@gmail.com
        calendar: ivan@gmail.com
        events: [{ summary: "Созвон с Петей", start: "2026-10-08T15:30:00+03:00", end: "2026-10-08T16:00:00+03:00" }]

- id: create-without-title-asks-name
  story: US-30
  steps:
    - *setup
    - telegram: { from: 1001, text: "Поставь встречу в пятницу в 3" }
