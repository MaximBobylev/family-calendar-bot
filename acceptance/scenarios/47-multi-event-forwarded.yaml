    - llm:
        "Пн 17:00 — танцы\nПн 18:30 — хор\nВт 18:00 — английский\nВт 19:30 — гитара\nСр 16:00 — рисование\nСр 18:00 — лепка\nЧт 17:30 — бассейн\nЧт 19:00 — шашки\nПт 16:00 — шахматы\nПт 18:00 — театр\nСб 11:00 — футбол\nВс 12:00 — цирк":
          tool: create_event
          args: { start: "Пн 17:00", title: "Танцы" }
    - telegram:
        from: 1001
        text: "Пн 17:00 — танцы\nПн 18:30 — хор\nВт 18:00 — английский\nВт 19:30 — гитара\nСр 16:00 — рисование\nСр 18:00 — лепка\nЧт 17:30 — бассейн\nЧт 19:00 — шашки\nПт 16:00 — шахматы\nПт 18:00 — театр\nСб 11:00 — футбол\nВс 12:00 — цирк"
        forwarded: true
    - press: "📅 Создать события из этого"
    - expect_telegram:
        - { text_contains: ["📅 Похоже на события"] }
        - { method: editMessageText, text_contains: ["Слишком много событий в одном сообщении (12) — добавьте их вручную или частями."] }
    - expect_google_events: { email: ivan@gmail.com, calendar: ivan@gmail.com, count: 0, events: [] }

- id: multi-forwarded-ignore-delete
  story: US-62
  steps:
    - *setup
    # Удаление в пересланном не исполняется никогда — в карточке только создания
    - telegram: { from: 1001, text: "Напоминаем: в среду в 17 хор, в четверг в 18 сольфеджио, удалите старое расписание", forwarded: true }
    - press: "📅 Создать события из этого"
    - expect_telegram:
        - { text_contains: ["📅 Похоже на события"] }
        - method: editMessageText
          text_contains: ["✅ 1. <b>Хор</b>\nср, 14 октября, 17:00–18:00", "✅ 2. <b>Сольфеджио</b>\nчт, 15 октября, 18:00–19:00"]
          text_not_contains: ["удалите", "расписание"]
          buttons: ["✅ 1 · Хор", "✅ 2 · Сольфеджио", "Создать все (2)", "Отмена"]

