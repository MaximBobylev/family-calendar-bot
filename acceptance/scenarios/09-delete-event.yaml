# US-50: удаление. US-05: подтверждение всегда. «Сейчас» — ср 7 октября 2026, 10:00 МСК.
# Те же события, что в 07-modify-event.yaml.

- id: delete-own-event
  story: US-50
  steps:
    - &setup
      - clock: "2026-10-07T07:00:00Z"
      - connected_user:
          from: 1001
          email: ivan@gmail.com
          calendars:
            - id: ivan@gmail.com
              summary: "Иван"
              accessRole: owner
              primary: true
              timeZone: Europe/Moscow
              events:
                - { id: e1, summary: "Планёрка", start: { dateTime: "2026-10-08T10:00:00+03:00" }, end: { dateTime: "2026-10-08T11:00:00+03:00" } }
                - id: e2
                  summary: "Созвон с Петей"
                  start: { dateTime: "2026-10-08T15:00:00+03:00" }
                  end: { dateTime: "2026-10-08T15:30:00+03:00" }
                  organizer: { self: true }
                  attendees: [{ self: true, responseStatus: accepted }, { email: "petya@example.com", responseStatus: accepted }]
                - { id: e3, summary: "Обед", start: { dateTime: "2026-10-09T13:00:00+03:00" }, end: { dateTime: "2026-10-09T14:00:00+03:00" } }
                - id: e4
                  summary: "Встреча у клиента"
                  start: { dateTime: "2026-10-08T12:00:00+03:00" }
                  end: { dateTime: "2026-10-08T13:00:00+03:00" }
                  organizer: { self: false, email: "client@example.com" }
                  attendees: [{ self: true, responseStatus: accepted }, { email: "client@example.com" }]
                - { id: e6, summary: "Созвон с Машей", start: { dateTime: "2026-10-09T16:00:00+03:00" }, end: { dateTime: "2026-10-09T16:30:00+03:00" } }
                # Серия «Стендап» по понедельникам: мастер (5 окт) и экземпляр 12 окт
                - { id: s1, summary: "Стендап", recurrence: ["RRULE:FREQ=WEEKLY;BYDAY=MO"], start: { dateTime: "2026-10-05T11:00:00+03:00" }, end: { dateTime: "2026-10-05T11:15:00+03:00" } }
                - { id: s1_20261012, recurringEventId: s1, summary: "Стендап", start: { dateTime: "2026-10-12T11:00:00+03:00" }, end: { dateTime: "2026-10-12T11:15:00+03:00" } }
      - llm:
          "Отмени только сегодняшний обед": { tool: delete_event, args: { event: "обед", scope: "this" } }
          # Голос: Whisper разрезал «отмени» на «от Мини» — бот исправляет до разбора (fixTranscript)
          "Обед отмени": { tool: delete_event, args: { event: "обед" } }
          "Удали обед в пятницу": { tool: delete_event, args: { event: "обед" } }
          "Отмени созвон с Петей": { tool: delete_event, args: { event: "созвон с Петей" } }
          "Удали встречу у клиента": { tool: delete_event, args: { event: "встречу у клиента" } }
          "Удали стендап": { tool: delete_event, args: { event: "стендап" } }
          "Удали все встречи на завтра": { tool: delete_event, args: {} }
          "Удали встречу с Олегом": { tool: delete_event, args: { event: "встречу с Олегом" } }
          "Отмени последнее": { tool: unsupported }
          "Убери планёрку": { tool: create_event, args: { start: "", title: "планёрку" } }
    - telegram: { from: 1001, text: "Удали обед в пятницу" }
    - expect_telegram:
        - text_contains: ["Удалить?", "<b>Обед</b>", "пт, 9 октября, 13:00–14:00"]
          text_not_contains: ["Участники"]
          buttons: ["Удалить", "Отмена"]
    - press: "Удалить"
    - expect_telegram:
        - { method: editMessageText, text_contains: ["🗑 Удалено", "Обед"] }
    - expect_google_deletes: { count: 1, id: e3, sendUpdates: none }
    - expect_google_events: { email: ivan@gmail.com, calendar: ivan@gmail.com, events: [], count: 6 }

- id: delete-notifies-attendees
  story: US-50
  steps:
    - *setup
    - telegram: { from: 1001, text: "Отмени созвон с Петей" }
    - expect_telegram:
        - { text_contains: ["Удалить?", "Созвон с Петей", "получат уведомление об отмене"] }
    - press: "Удалить"
    - expect_google_deletes: { count: 1, id: e2, sendUpdates: all }

- id: delete-not-organizer-declines
  story: US-50
  steps:
    - *setup
    - telegram: { from: 1001, text: "Удали встречу у клиента" }
    - expect_telegram:
        - text_contains: ["Отклонить приглашение?", "Встреча у клиента", "Встреча не удаляется"]
          buttons: ["Отклонить", "Отмена"]
    - press: "Отклонить"
    - expect_telegram:
        - { method: editMessageText, text_contains: ["Приглашение отклонено"] }
    - expect_google_deletes: { count: 0 }
    - expect_google_patches: { count: 1, id: e4, sendUpdates: all }

- id: delete-recurring-only-this
  story: US-50
  steps:
    - *setup
    - telegram: { from: 1001, text: "Удали стендап" }
    - expect_telegram:
        - { text_contains: ["Удалить?", "Стендап", "пн, 12 октября"], buttons: ["Только эту", "Всю серию", "Отмена"] }
    - press: "Только эту"
    - expect_google_deletes: { count: 1, id: s1_20261012 }

- id: delete-recurring-whole-series
  story: US-50
  steps:
    - *setup
    - telegram: { from: 1001, text: "Удали стендап" }
    - press: "Всю серию"
    - expect_telegram:
        - { text_contains: ["Удалить?"] }
        - { method: editMessageText, text_contains: ["Удалена вся серия"] }
    - expect_google_deletes: { count: 1, id: s1 }
    - expect_google_events: { email: ivan@gmail.com, calendar: ivan@gmail.com, events: [], count: 5 }

- id: delete-cancel-keeps-event
  story: US-05
  steps:
    - *setup
    - telegram: { from: 1001, text: "Удали обед в пятницу" }
    - press: "Отмена"
    - expect_google_deletes: { count: 0 }

- id: delete-changed-meanwhile
  story: US-50
  steps:
