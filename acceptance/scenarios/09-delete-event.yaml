- id: undo-nothing
  story: US-61
  steps:
    - *setup
    - telegram: { from: 1001, text: "Отмени последнее" }
    - expect_telegram:
        - { text_contains: ["Нечего отменять"] }

- id: undo-after-delete-impossible
  story: US-61
  steps:
    - *setup
    - telegram: { from: 1001, text: "Удали обед в пятницу" }
    - press: "Удалить"
    - telegram: { from: 1001, text: "Отмени последнее" }
    - expect_telegram:
        - { text_contains: ["Удалить?"] }
        - { method: editMessageText, text_contains: ["Удалено"] }
        - { text_contains: ["Удаление отменить нельзя"] }

- id: plain-cancel-word-cancels-open-card
  story: US-05
  steps:
    - *setup
    - telegram: { from: 1001, text: "Удали обед в пятницу" }
    - telegram: { from: 1001, text: "Отмена" }
    - expect_telegram:
        - { text_contains: ["Удалить?"] }
        - { method: editMessageText, text_contains: ["Отменено"] }
    - expect_google_deletes: { count: 0 }

- id: delete-named-day-empty-suggests-other-day
  story: US-50
  steps:
    - *setup
    # Сегодня (ср, 7 октября) обеда нет — бот находит его в пятницу и спрашивает, а не отвечает «не нашёл»
    - telegram: { from: 1001, text: "Отмени только сегодняшний обед" }
    - expect_telegram:
        - { text_contains: ["В этот день «обед» нет. Нашёл в другие дни — эту?"], buttons: ["пт, 9 октября, 13:00–14:00 — Обед", "Отмена"] }
    - press: "пт, 9 октября, 13:00–14:00 — Обед"
    - expect_telegram:
        - { method: editMessageText }
        - { text_contains: ["Удалить", "<b>Обед</b>"] }

- id: delete-by-voice-with-whisper-split-verb
  story: US-10
  steps:
    - *setup
    - voice: { from: 1001, transcript: "Обед от Мини" }
    - expect_telegram:
        - { text_contains: ["🎙 <i>Обед отмени</i>"] }
        - { text_contains: ["Удалить", "<b>Обед</b>"] }
