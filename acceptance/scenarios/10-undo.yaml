- id: undo-only-last-action
  story: US-61
  steps:
    - *setup
    - telegram: { from: 1001, text: "Сдвинь планёрку на час позже" }
    - press: "Подтвердить"
    - telegram: { from: 1001, text: "Перенеси обед на завтра" }
    - press: "Подтвердить"
    # Кнопка «Отменить» под первым изменением — уже не последнее действие
    - http_get: { path: "/health" }
    - telegram: { from: 1001, text: "Отмени последнее" }
    - expect_google_events:
        email: ivan@gmail.com
        calendar: ivan@gmail.com
        events:
          - { summary: "Обед", start: "2026-10-09T13:00:00+03:00", end: "2026-10-09T14:00:00+03:00" }
          - { summary: "Планёрка", start: "2026-10-08T11:00:00+03:00", end: "2026-10-08T12:00:00+03:00" }

- id: undo-refused-after-external-change
  story: US-61
  steps:
    - *setup
    - telegram: { from: 1001, text: "Сдвинь планёрку на час позже" }
    - press: "Подтвердить"
    - google_touch: { email: ivan@gmail.com, calendar: ivan@gmail.com, id: e1 }
    - press: "↩ Отменить"
    - expect_telegram:
        - { text_contains: ["Перенести?"] }
        - { method: editMessageText, text_contains: ["✅ Изменено"] }
        - { text_contains: ["уже изменили после этого"] }
    - expect_google_patches: { count: 1 }

