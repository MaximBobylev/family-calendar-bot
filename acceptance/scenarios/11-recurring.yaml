# US-32: создание повторяющихся событий. «Сейчас» — ср 7 октября 2026, 10:00 МСК.
# Правило берётся из текста детерминированно (не от LLM); карточка — всегда с подтверждением,
# правило словами и три ближайшие даты; серия начинается с первой даты не раньше «сейчас».

- id: recurring-weekly
  story: US-32
  steps:
    - &setup
      - clock: "2026-10-07T07:00:00Z"
      - connected_user:
          from: 1001
          email: ivan@gmail.com
          calendars:
            - { id: ivan@gmail.com, summary: "Иван", accessRole: owner, primary: true, timeZone: Europe/Moscow }
      - llm:
          "Каждый понедельник в 10 планёрка": { tool: create_event, args: { start: "Каждый понедельник в 10", title: "Планёрка" } }
          "Планёрка по будням в 11 до конца года": { tool: create_event, args: { start: "по будням в 11 до конца года", title: "Планёрка" } }
          "Каждую среду в 9 зарядка": { tool: create_event, args: { start: "Каждую среду в 9", title: "Зарядка" } }
          "Раз в две недели по четвергам в 15 ретро на полчаса": { tool: create_event, args: { start: "Раз в две недели по четвергам в 15", title: "Ретро", duration: "на полчаса" } }
          "Оплата квартиры 31 числа каждого месяца в 12": { tool: create_event, args: { start: "31 числа каждого месяца в 12", title: "Оплата квартиры" } }
          "Йога по вторникам": { tool: create_event, args: { start: "по вторникам", title: "Йога" } }
          "Каждый год 3 марта день рождения мамы": { tool: create_event, args: { start: "Каждый год 3 марта", title: "День рождения мамы", all_day: true } }
          "Отчёт в последнюю пятницу месяца в 17": { tool: create_event, args: { start: "в последнюю пятницу месяца в 17", title: "Отчёт" } }
          "Поставь встречу в понедельник в 10": { tool: create_event, args: { start: "в понедельник в 10" } }
    - telegram: { from: 1001, text: "Каждый понедельник в 10 планёрка" }
    - expect_telegram:
        - text_contains: ["Создать повторяющееся событие?", "<b>Планёрка</b>", "🔁 Каждый понедельник, 10:00–11:00", "Ближайшие: пн, 12 октября · пн, 19 октября · пн, 26 октября"]
          buttons: ["Создать", "Отмена"]
    - press: "Создать"
    - expect_telegram:
        - { method: editMessageText, text_contains: ["✅ Создано", "🔁 Каждый понедельник"], buttons: ["Открыть в календаре", "↩ Отменить"] }
    - expect_google_events:
        email: ivan@gmail.com
        calendar: ivan@gmail.com
        count: 1
        events: [{ summary: "Планёрка", start: "2026-10-12T10:00:00+03:00", end: "2026-10-12T11:00:00+03:00", recurrence: ["RRULE:FREQ=WEEKLY;BYDAY=MO"] }]

- id: recurring-weekdays-until-end-of-year-starts-today
  story: US-32
  steps:
    - *setup
    - telegram: { from: 1001, text: "Планёрка по будням в 11 до конца года" }
    - expect_telegram:
        - text_contains: ["🔁 По будням до 31 декабря, 11:00–12:00", "Ближайшие: ср, 7 октября · чт, 8 октября · пт, 9 октября"]
    - press: "Создать"
    - expect_telegram:
        - { method: editMessageText, text_contains: ["✅ Создано"] }
    - expect_google_events:
        email: ivan@gmail.com
        calendar: ivan@gmail.com
        events: [{ summary: "Планёрка", start: "2026-10-07T11:00:00+03:00", end: "2026-10-07T12:00:00+03:00", recurrence: ["RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR;UNTIL=20261231T205900Z"] }]

