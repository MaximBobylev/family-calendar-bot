- id: recurring-undo-removes-whole-series
  story: US-61
  steps:
    - *setup
    - telegram: { from: 1001, text: "Каждый понедельник в 10 планёрка" }
    - press: "Создать"
    - press: "↩ Отменить"
    - expect_telegram:
        - { text_contains: ["Создать повторяющееся событие?"] }
        - { method: editMessageText, text_contains: ["✅ Создано"] }
        - { method: editMessageText, text_contains: ["↩ Отменено", "Планёрка"] }
    - expect_google_events: { email: ivan@gmail.com, calendar: ivan@gmail.com, events: [], count: 0 }

- id: single-weekday-stays-one-off
