# Всё окружение — в контейнере, на хосте нужен только Docker.
#   docker compose run --rm test          — тесты (vitest)
#   docker compose run --rm test npm run typecheck
#   docker compose run --rm test npm run check    — typecheck + линтер и формат (Biome, docs/code-style.md)
#   docker compose up dev                 — wrangler dev на http://localhost:8787 (+ фейки)
#   docker compose run --rm acceptance    — приёмочные сценарии (поднимет dev и fakes)
#   docker compose run --rm deploy        — деплой (секреты из .env)
# После изменения package.json: docker compose build && docker compose run --rm dev npm ci

x-app: &app
  build: .
  image: calendar-assist-bot-dev
  working_dir: /app
  volumes:
    - .:/app
    # node_modules — отдельный том: бинарники workerd/esbuild для Linux, а не для macOS хоста
    - node_modules:/app/node_modules
    # Файл .env с боевыми секретами в контейнеры не попадает (ревью безопасности 2026-10-05)
    - /dev/null:/app/.env:ro

services:
  dev:
    <<: *app
    environment:
      # wrangler 4 сам читает .env из корня — там боевые секреты; локально они не нужны
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
    command: ["sh", "-c", "npx wrangler d1 migrations apply DB --local --env dev && npx wrangler dev --env dev --ip 0.0.0.0 --port 8787"]
    ports:
      - "8787:8787"
    depends_on: [fakes]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      retries: 40

  test:
    <<: *app
    command: ["npm", "test"]

  # Деплой и команды, которым нужны боевые секреты: только здесь .env передаётся как окружение
  deploy:
    <<: *app
    command: ["npm", "run", "-s", "deploy"]
    env_file:
      - path: .env
        required: false

  # Фейки внешних API (Telegram, позже Google) для приёмочных тестов
  fakes:
    <<: *app
    command: ["npx", "tsx", "acceptance/fakes/server.ts"]

  # Приёмочные сценарии: бот как чёрный ящик по HTTP (ADR-0006)
  acceptance:
    <<: *app
    command: ["npx", "tsx", "acceptance/runner.ts"]
    environment:
      SUT_URL: http://dev:8787
      FAKES_URL: http://fakes:9100
      WEBHOOK_SECRET: test-secret
    depends_on:
      dev:
        condition: service_healthy
      fakes:
        condition: service_started

volumes:
  node_modules:
